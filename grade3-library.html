
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتب ومذكرات وامتحانات الصف الثالث الإعدادي 2027 | مستر محمد ربيع</title>

<meta name="description" content="المكتبة التعليمية للصف الثالث الإعدادي 2027، كتب ومذكرات وامتحانات رياضيات مع مستر محمد ربيع.">

<meta name="author" content="مستر محمد ربيع">

<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
  direction: rtl;
  text-align: right;
  line-height: 1.8;
}

header {
  background: linear-gradient(135deg, #102b55, #1769aa);
  color: white;
  text-align: center;
  padding: 35px 15px;
  border-radius: 0 0 25px 25px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 27px;
}

header p {
  margin: 5px 0;
}

main {
  width: 92%;
  max-width: 950px;
  margin: 25px auto;
}

.panel {
  background: white;
  padding: 22px;
  margin: 20px 0;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

h2 {
  color: #07549a;
  margin-top: 0;
}

.muted {
  color: #64748b;
}

.back {
  display: inline-block;
  background: #0876bd;
  color: white;
  text-decoration: none;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.library-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.library-item {
  background: #f5f8fc;
  border: 1px solid #dce7f3;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  transition: .2s;
}

.library-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 5px 15px rgba(0,0,0,.10);
}

.library-icon {
  font-size: 38px;
}

.library-item h3 {
  color: #123d70;
  margin: 8px 0;
}

.library-item p {
  color: #64748b;
  font-size: 14px;
}

.resource-link {
  display: inline-block;
  background: #0876bd;
  color: white;
  text-decoration: none;
  padding: 9px 18px;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 8px;
}

.resource-link:hover {
  background: #064f88;
}

.notice {
  background: #eef5ff;
  color: #24466b;
  padding: 14px;
  border-radius: 10px;
}

footer {
  background: #102b55;
  color: white;
  text-align: center;
  padding: 22px;
  margin-top: 35px;
}

footer p {
  margin-bottom: 0;
}

@media(max-width:600px) {
  header h1 {
    font-size: 22px;
  }

  .panel {
    padding: 16px;
  }
}
