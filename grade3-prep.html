
<style>
#mathQuiz {
  direction: rtl;
  text-align: right;
  margin-top: 20px;
}
#mathQuiz .quiz-progress {
  background: #eaf2ff;
  color: #174a91;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 18px;
  font-weight: bold;
}
#mathQuiz .quiz-q {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}
#mathQuiz .quiz-question-title {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.9;
  margin-bottom: 18px;
}
#mathQuiz .quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f7f9fc;
  border: 1px solid #ddd;
  padding: 13px;
  margin: 10px 0;
  border-radius: 9px;
  cursor: pointer;
  line-height: 1.7;
}
#mathQuiz .quiz-option:has(input:checked) {
  background: #e5f0ff;
  border-color: #2678c8;
}
#mathQuiz .quiz-option input {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
#mathQuiz .quiz-navigation {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 15px 0;
}
#mathQuiz button:disabled {
  opacity: .45;
  cursor: not-allowed;
}
#mathQuiz .result {
  font-size: 20px;
  font-weight: bold;
  color: #087c83;
  margin-top: 20px;
}
#mathQuiz .quiz-review-item {
  border: 1px solid #ddd;
  padding: 14px;
  border-radius: 10px;
  margin: 12px 0;
  line-height: 1.9;
}
#mathQuiz .correct-answer {
  color: #087c35;
  font-weight: bold;
}
#mathQuiz .wrong-answer {
  color: #b42318;
  font-weight: bold;
}
</style>

<section class="panel" id="mathQuiz">
  <h2>📝 الاختبار الإلكتروني في الرياضيات</h2>
  <p>اختبر مستواك في الرياضيات من خلال 35 سؤالًا. أجب عن جميع الأسئلة ثم اضغط على إنهاء الاختبار لمعرفة نتيجتك.</p>

  <div class="quiz-progress" id="quizProgress"></div>
  <div class="quiz-q" id="quizQuestion"></div>

  <div class="quiz-navigation">
    <button class="btn secondary" type="button" id="quizPrev">السابق</button>
    <button class="btn" type="button" id="quizNext">السؤال التالي</button>
    <button class="btn" type="button" id="quizSubmit" hidden>إنهاء الاختبار وتصحيح الإجابات</button>
  </div>

  <p class="result" id="quizResult" aria-live="polite"></p>
  <div id="quizReview"></div>
</section>

<script>
const quizQuestions = [
  {
    q: "صورة النقطة (3,5-) بتمدد مركزه نقطة الأصل ومعاملته 3.",
    o: ["(1,2-)", "(9,6-)", "(3,2-)", "(9,15-)"],
    a: 3
  },
  {
    q: "معادلة المستقيم الذي يصنع زاوية 45 ومقطع y يساوي 3.",
    o: ["x-y=-3", "x+y=-3", "x-y=3", "x+y=3"],
    a: 0
  },
  {
    q: "إذا كانت 2sinx=tanx فإن x:",
    o: ["60", "45", "30", "15"],
    a: 0
  },
  {
    q: "ميل المستقيم العمودي على المستقيم x=3y+1:",
    o: ["3", "-3", "1/3", "-1/3"],
    a: 1
  },
  {
    q: "مثلث ABC قائم في B وكان 5AB=4AC، أوجد tan C.",
    o: ["3/4", "4/5", "4/3", "3/5"],
    a: 2
  },
  {
    q: "قياس زاوية ميل المستقيم المار بالنقطتين (5,6),(4,7):",
    o: ["45", "60", "120", "135"],
    a: 3
  },
  {
    q: "المستقيم 3y-kx=13 يوازي المستقيم (k-1)x-2y=8، أوجد k.",
    o: ["3", "2", "1", "-2"],
    a: 0
  },
  {
    q: "الانحراف المعياري للقيم 5,5,5,5:",
    o: ["0", "5", "4", "20"],
    a: 0
  },
  {
    q: "لأي زاوية حادة x، قيمة sinx-cosx tanx:",
    o: ["1", "2", "0", "-1"],
    a: 2
  },
  {
    q: "معادلة المستقيم الذي يمر بالنقطة (2,1-) ويوازي محور y.",
    o: ["x=-2", "y=1", "x=2", "y=-1"],
    a: 0
  },
  {
    q: "إذا كان tanx sin30=cos30، أوجد x.",
    o: ["30", "45", "60", "75"],
    a: 2
  },
  {
    q: "المستقيمان 3x-4y=3 و4x+ky=8 متعامدان، أوجد k.",
    o: ["3", "4", "-3", "-4"],
    a: 0
  },
  {
    q: "ميل المستقيم العمودي على محور x:",
    o: ["0", "1", "-1", "غير معرف"],
    a: 3
  },
  {
    q: "أي من الآتي ليس مقياس تشتت:",
    o: ["المدى", "المدى الربيعي", "الوسيط", "الانحراف المعياري"],
    a: 2
  },
  {
    q: "مساحة المثلث المحدد بالمستقيمات x=0,y=0,5x-6y=30:",
    o: ["60", "30", "15", "7.5"],
    a: 2
  },
  {
    q: "ميل المستقيم العمودي على محور y:",
    o: ["0", "1", "-1", "غير معرف"],
    a: 0
  },
  {
    q: "إذا كان المدى الربيعي 8 والربيع الأدنى 7، الربيع الأعلى:",
    o: ["1", "8", "7", "15"],
    a: 3
  },
  {
    q: "أي النسب التالية تمثل معامل تصغير لتمدد:",
    o: ["120%", "50%", "5/4", "2"],
    a: 1
  },
  {
    q: "إذا كان sin4x÷cos2x=1، قيمة x:",
    o: ["30", "15", "45", "20"],
    a: 1
  },
  {
    q: "إذا كان 1=tan(3x÷2)، قيمة x:",
    o: ["10", "30", "45", "60"],
    a: 1
  },
  {
    q: "جميع ........ متشابهة:",
    o: ["المثلثات", "المربعات", "المعينات", "المستطيلات"],
    a: 1
  },
  {
    q: "إذا كان ABCD معين وكان C(-6,9), A(-3,8)، فإن ميل BD:",
    o: ["3", "-1/3", "1/3", "-3"],
    a: 0
  },
  {
    q: "إذا كان الانحراف المعياري للقيم A-2,4,B+3 صفرًا، فإن A+B:",
    o: ["4", "6", "7", "9"],
    a: 2
  },
  {
    q: "إذا كان ABCD مربعًا فيه ميل AB=-1/2، ميل BC:",
    o: ["-1/2", "2", "-2", "1"],
    a: 1
  },
  {
    q: "إذا كان المستقيم المار بالنقطتين A(k,3), B(2,4) يصنع زاوية 45، قيمة k:",
    o: ["1", "2", "-1", "-2"],
    a: 0
  },
  {
    q: "المدى لمجموعة القيم x+8,x+4,x-3:",
    o: ["1", "4", "11", "7"],
    a: 2
  },
  {
    q: "مثلث ABC قائم في B، قيمة sinA+2cosC:",
    o: ["2sinC", "3sinA", "2sinA", "3cosA"],
    a: 1
  },
  {
    q: "إذا كان 2cos(x+20)=tan45، قيمة x:",
    o: ["60", "45", "40", "30"],
    a: 2
  },
  {
    q: "ميل المستقيم 3y=kx-5 ويمر بالنقطة (20,5):",
    o: ["1", "-2", "1/3", "-1"],
    a: 2
  },
  {
    q: "ميل المستقيم x-3=0:",
    o: ["3", "1/3", "صفر", "غير معرف"],
    a: 3
  },
  {
    q: "إذا كان ميل مستقيم أكبر من الصفر فإن زاوية ميله:",
    o: ["حادة", "قائمة", "منفرجة", "مستقيمة"],
    a: 0
  },
  {
    q: "إذا كان cosx tanx=1/2، قيمة x:",
    o: ["60", "30", "45", "90"],
    a: 1
  },
  {
    q: "مجموعة أصفار الدالة 0=f(x):",
    o: ["{0}", "R", "R-{0}", "فاي"],
    a: 1
  },
  {
    q: "ميل المستقيم y-5=0:",
    o: ["5", "-5", "0", "غير معرف"],
    a: 2
  },
  {
    q: "المدى للقيم 6,A,7,2 هو 8، قيمة A:",
    o: ["10", "7", "9", "4"],
    a: 0
  }
];

const quizLetters = ["أ", "ب", "ج", "ء"];
let quizAnswers = Array(quizQuestions.length).fill(null);
let quizIndex = 0;
let quizFinished = false;

function renderQuizQuestion() {
  const holder = document.getElementById("quizQuestion");
  const progress = document.getElementById("quizProgress");
  const previous = document.getElementById("quizPrev");
  const next = document.getElementById("quizNext");
  const submit = document.getElementById("quizSubmit");
  const item = quizQuestions[quizIndex];

  progress.textContent =
    "السؤال " + (quizIndex + 1) + " من " + quizQuestions.length +
    " — تمت الإجابة عن " +
    quizAnswers.filter(value => value !== null).length + " سؤالًا";

  holder.replaceChildren();

  const heading = document.createElement("p");
  heading.className = "quiz-question-title";
  heading.textContent = (quizIndex + 1) + ". " + item.q;
  holder.appendChild(heading);

  item.o.forEach((option, optionIndex) => {
    const label = document.createElement("label");
    label.className = "quiz-option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "currentQuizAnswer";
    radio.value = String(optionIndex);
    radio.checked = quizAnswers[quizIndex] === optionIndex;

    radio.addEventListener("change", () => {
      quizAnswers[quizIndex] = optionIndex;
      renderQuizQuestion();
    });

    const optionText = document.createElement("span");
    optionText.textContent =
      quizLetters[optionIndex] + ") " + option;

    label.append(radio, optionText);
    holder.appendChild(label);
  });

  previous.disabled = quizIndex === 0;
  next.hidden = quizIndex === quizQuestions.length - 1;
  submit.hidden = quizIndex !== quizQuestions.length - 1;
}

function finishQuiz() {
  if (quizFinished) return;

  const unanswered = quizAnswers.filter(value => value === null).length;

  if (unanswered > 0) {
    document.getElementById("quizResult").textContent =
      "لم تجب عن " + unanswered +
      " سؤالًا. يمكنك الرجوع إليها أو إنهاء الاختبار.";
    return;
  }

  quizFinished = true;

  const score = quizQuestions.reduce((total, question, index) => {
    return total +
      (quizAnswers[index] === question.a ? 1 : 0);
  }, 0);

  document.getElementById("quizResult").textContent =
    "نتيجتك: " + score + " من " + quizQuestions.length;

  document.getElementById("quizQuestion").hidden = true;
  document.getElementById("quizProgress").hidden = true;
  document.getElementById("quizPrev").hidden = true;
  document.getElementById("quizNext").hidden = true;
  document.getElementById("quizSubmit").hidden = true;

  const review = document.getElementById("quizReview");
  const title = document.createElement("h3");
  title.textContent = "مراجعة الإجابات";
  review.appendChild(title);

  quizQuestions.forEach((question, index) => {
    const entry = document.createElement("div");
    entry.className = "quiz-review-item";

    const prompt = document.createElement("p");
    prompt.textContent = (index + 1) + ". " + question.q;

    const chosen = document.createElement("p");
    chosen.textContent =
      "إجابتك: " + quizLetters[quizAnswers[index]] +
      ") " + question.o[quizAnswers[index]];

    chosen.className =
      quizAnswers[index] === question.a
        ? "correct-answer"
        : "wrong-answer";

    const correct = document.createElement("p");
    correct.textContent =
      "الإجابة الصحيحة: " + quizLetters[question.a] +
      ") " + question.o[question.a];

    entry.append(prompt, chosen, correct);
    review.appendChild(entry);
  });
}

document.getElementById("quizPrev").addEventListener("click", () => {
  if (quizIndex > 0) {
    quizIndex--;
    renderQuizQuestion();
  }
});

document.getElementById("quizNext").addEventListener("click", () => {
  if (quizIndex < quizQuestions.length - 1) {
    quizIndex++;
    renderQuizQuestion();
  }
});

document.getElementById("quizSubmit").addEventListener("click", finishQuiz);

renderQuizQuestion();
</script>
